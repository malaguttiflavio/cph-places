<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>CPH Places</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1c1c1e; --muted: #6b7280;
    --line: #e5e1d8; --accent: #b3502d; --chip: #ece8df; --chip-on: #1c1c1e;
    --want: #b3502d; --been: #4b7f52; --fav: #c2372e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101418; --panel: #1a2027; --ink: #ececec; --muted: #9aa3ad;
      --line: #2a323b; --accent: #e07a4f; --chip: #232b34; --chip-on: #ececec;
      --want: #e07a4f; --been: #7dbb85; --fav: #ef6a5f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) 0 0 0;
  }
  header { padding: 10px 14px 6px; flex: none; }
  .headrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  #addbtn {
    border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  #search {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 15px; outline: none;
  }
  .chiprow { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 4px; flex: none; scrollbar-width: none; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 6px 11px; border-radius: 999px; background: var(--chip);
    border: 1px solid transparent; color: var(--ink); font-size: 13.5px; cursor: pointer; user-select: none;
  }
  .chip.on { background: var(--chip-on); color: var(--bg); }
  main { flex: 1; position: relative; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  #map { height: 100%; }
  #listview { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 14px 20px; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 11px 12px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  .item .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .item .tx { flex: 1; min-width: 0; }
  .item .nm { font-weight: 600; font-size: 15.5px; }
  .item .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; font-size: 12px; padding: 4px 9px; border-radius: 999px;
    border: 1.5px solid var(--line); color: var(--muted); background: none; cursor: pointer;
  }
  .badge.want { border-color: var(--want); color: var(--want); }
  .badge.beenplus  { border-color: var(--been); color: var(--been); }
  .badge.beenminus { border-color: var(--muted); color: var(--muted); }
  .badge.fav  { border-color: var(--fav);  color: var(--fav); }
  #tonight { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 18px; text-align: center; overflow-y: auto; }
  #tonight .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 26px 22px; max-width: 340px; width: 100%; box-shadow: 0 6px 24px rgba(0,0,0,.07);
  }
  #tonight .cat { font-size: 34px; }
  #tonight h2 { margin: 8px 0 4px; font-size: 21px; }
  #tonight .sub { color: var(--muted); font-size: 14px; }
  .btn {
    margin-top: 14px; padding: 11px 18px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 15.5px; font-weight: 600;
  }
  .btn.ghost { background: none; border: 1.5px solid var(--line); color: var(--ink); font-weight: 500; }
  .btn.danger { background: none; border: 1.5px solid var(--fav); color: var(--fav); font-weight: 500; }
  nav {
    flex: none; display: flex; border-top: 1px solid var(--line); background: var(--panel);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; padding: 10px 0 8px; background: none; border: none; color: var(--muted);
    font-size: 11.5px; cursor: pointer;
  }
  nav button .ic { display: block; font-size: 21px; margin-bottom: 1px; }
  nav button.on { color: var(--accent); }
  #sheetwrap { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 2000; }
  #sheetwrap.on { display: block; }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height: 85%; overflow-y: auto;
  }
  #sheet h2 { margin: 0 0 2px; font-size: 20px; }
  #sheet .sub { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  #sheet textarea, #sheet input[type=text] {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); padding: 9px; font: inherit; font-size: 14.5px;
  }
  #sheet textarea { min-height: 64px; }
  #sheet .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #sheet .lbl { margin: 12px 0 4px; font-size: 13.5px; color: var(--muted); }
  .catgrid { display: flex; flex-wrap: wrap; gap: 6px; }
  .statusseg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 4px; }
  .statusseg button { flex: 1; padding: 9px 4px; background: none; border: none; color: var(--muted); font-size: 13.5px; cursor: pointer; }
  .statusseg button.on.want { background: var(--want); color: #fff; }
  .statusseg button.on.beenplus  { background: var(--been); color: #fff; }
  .statusseg button.on.beenminus { background: var(--muted); color: #fff; }
  .statusseg button.on.fav  { background: var(--fav);  color: #fff; }
  .leaflet-popup-content { font: 14px/1.4 -apple-system, sans-serif; margin: 10px 12px; }
  .leaflet-popup-content b { font-size: 15px; }
  .plink { color: var(--accent); font-weight: 600; text-decoration: none; }
  #counts { color: var(--muted); font-size: 12.5px; padding: 0 14px 6px; flex: none; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="headrow">
    <h1>CPH Places</h1>
    <button id="addbtn">＋ Add place</button>
  </div>
  <input id="search" type="search" placeholder="Search places, areas, notes…">
</header>
<div class="chiprow" id="catchips"></div>
<div class="chiprow" id="areachips"></div>
<div class="chiprow" id="statuschips"></div>
<div id="counts"></div>

<main>
  <div class="view on" id="mapview"><div id="map"></div></div>
  <div class="view" id="listview"></div>
  <div class="view" id="tonightview">
    <div id="tonight">
      <div class="chiprow" id="moodchips" style="justify-content:center;flex-wrap:wrap;overflow:visible;"></div>
      <div class="card" id="tcard">
        <div class="cat">🎲</div>
        <h2>Where to tonight?</h2>
        <div class="sub">Pick a mood and roll — I'll only suggest places you haven't been.</div>
      </div>
      <button class="btn" id="roll">Surprise me</button>
      <div class="row" style="margin-top:18px; display:flex; gap:8px;">
        <button class="btn ghost" id="exportbtn">Export my data</button>
        <label class="btn ghost" style="display:inline-block;">Import<input type="file" id="importfile" accept=".json" style="display:none"></label>
      </div>
      <button class="btn ghost" id="restorebtn" style="display:none"></button>
    </div>
  </div>
</main>

<nav>
  <button data-v="mapview" class="on"><span class="ic">🗺️</span>Map</button>
  <button data-v="listview"><span class="ic">📋</span>List</button>
  <button data-v="tonightview"><span class="ic">🎲</span>Tonight</button>
</nav>

<div id="sheetwrap"><div id="sheet"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="places.js"></script>
<script>
const CATS = {
  cafe:       { label: "Cafés",          emoji: "☕", color: "#a4753a" },
  bakery:     { label: "Bakeries",       emoji: "🥐", color: "#d8a13a" },
  bar:        { label: "Bars",           emoji: "🍺", color: "#c2622e" },
  wine:       { label: "Wine",           emoji: "🍷", color: "#8e3b52" },
  jazz:       { label: "Jazz & Music",   emoji: "🎷", color: "#3f5da8" },
  club:       { label: "Clubs",          emoji: "🪩", color: "#7b4fa5" },
  restaurant: { label: "Restaurants",    emoji: "🍝", color: "#b8452f" },
  street:     { label: "Street food",    emoji: "🌭", color: "#d0763a" },
  museum:     { label: "Museums & Art",  emoji: "🖼️", color: "#2e7d7b" },
  sight:      { label: "Sights",         emoji: "🏛️", color: "#5a7a4f" },
  stage:      { label: "Stage & Screen", emoji: "🎭", color: "#a5486d" },
  shop:       { label: "Shops & Books",  emoji: "🛍️", color: "#587a8a" },
  trip:       { label: "Day trips",      emoji: "🌊", color: "#3a7aa8" },
  other:      { label: "Other",          emoji: "📍", color: "#8a8a8a" },
};
const STATUSES = { want: "Want to go", beenplus: "Been 👍", beenminus: "Been 👎", fav: "❤️ Favorite" };

const store = {
  data: JSON.parse(localStorage.getItem("cphPlacesState") || "{}"),
  save() { localStorage.setItem("cphPlacesState", JSON.stringify(this.data)); },
  status(id) { return this.data.statuses[id] || "want"; },
  setStatus(id, s) { this.data.statuses[id] = s; this.save(); },
  note(id) { return this.data.notes[id] ?? null; },
  setNote(id, n) { this.data.notes[id] = n; this.save(); },
};
// Older backups may miss newer keys.
store.data.statuses ||= {};
store.data.notes ||= {};
store.data.cats ||= {};    // per-place category overrides
store.data.custom ||= [];  // places added in-app
store.data.hidden ||= [];  // stock places the user deleted
// Legacy migration: plain "been" predates the liked/disliked split.
if (Object.values(store.data.statuses).includes("been")) {
  for (const [k, v] of Object.entries(store.data.statuses)) if (v === "been") store.data.statuses[k] = "beenplus";
  store.save();
}

function allPlaces() { return PLACES.filter(p => !store.data.hidden.includes(p.id)).concat(store.data.custom); }
function byId(id) { return allPlaces().find(x => x.id === id); }
function effCats(p) {
  const o = store.data.cats[p.id];
  const c = (o && o.length) ? o : p.cats;
  return c.length ? c : ["other"];
}
function setCats(p, cats) {
  if (p.id.startsWith("c")) { p.cats = cats; }  // custom place: edit in place
  else { store.data.cats[p.id] = cats; }        // stock place: override
  store.save();
}
function effNote(p) { const n = store.note(p.id); return n !== null ? n : (p.note || ""); }

let catFilter = null, statusFilter = null, areaFilter = null, query = "";

function matches(p) {
  if (catFilter && !effCats(p).includes(catFilter)) return false;
  if (areaFilter && p.area !== areaFilter) return false;
  if (statusFilter && store.status(p.id) !== statusFilter) return false;
  if (query) {
    const q = query.toLowerCase();
    const hay = (p.name + " " + p.area + " " + (p.address || "") + " " + effNote(p) + " " +
      effCats(p).map(c => CATS[c].label).join(" ")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const filtered = () => allPlaces().filter(matches);

// ----- chips -----
function buildChips() {
  const cc = document.getElementById("catchips");
  cc.innerHTML = "";
  cc.appendChild(mkChip("All", () => { catFilter = null; render(); }, catFilter === null));
  for (const [k, c] of Object.entries(CATS)) {
    cc.appendChild(mkChip(c.emoji + " " + c.label, () => { catFilter = catFilter === k ? null : k; render(); }, catFilter === k));
  }
  const ac = document.getElementById("areachips");
  ac.innerHTML = "";
  ac.appendChild(mkChip("All areas", () => { areaFilter = null; render(); }, areaFilter === null));
  const areaCounts = {};
  for (const p of allPlaces()) areaCounts[p.area] = (areaCounts[p.area] || 0) + 1;
  const areas = Object.keys(areaCounts).sort((a, b) => areaCounts[b] - areaCounts[a] || a.localeCompare(b));
  for (const a of areas) {
    ac.appendChild(mkChip(`${a} (${areaCounts[a]})`, () => { areaFilter = areaFilter === a ? null : a; render(); }, areaFilter === a));
  }
  const sc = document.getElementById("statuschips");
  sc.innerHTML = "";
  sc.appendChild(mkChip("Any status", () => { statusFilter = null; render(); }, statusFilter === null));
  for (const [k, lab] of Object.entries(STATUSES)) {
    sc.appendChild(mkChip(lab, () => { statusFilter = statusFilter === k ? null : k; render(); }, statusFilter === k));
  }
}
function mkChip(label, onclick, on) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.textContent = label;
  b.onclick = onclick;
  return b;
}

// ----- map -----
const map = L.map("map", { zoomControl: false }).setView([55.6785, 12.5555], 13);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 20,
}).addTo(map);
let markers = [];
function renderMap() {
  markers.forEach(m => m.remove());
  markers = [];
  for (const p of filtered()) {
    const st = store.status(p.id);
    const visited = st === "beenplus" || st === "beenminus";
    const c0 = CATS[effCats(p)[0]];
    const m = L.circleMarker([p.lat, p.lng], {
      radius: st === "fav" ? 9 : 7,
      color: visited ? "#9aa3ad" : c0.color,
      fillColor: visited ? "#9aa3ad" : c0.color,
      fillOpacity: st === "beenminus" ? 0.2 : visited ? 0.45 : 0.85,
      weight: st === "fav" ? 3 : 1.5,
    }).addTo(map);
    m.bindPopup(`<b>${esc(p.name)}</b><br>${effCats(p).map(c => CATS[c].emoji + " " + CATS[c].label).join(" · ")}${p.rating ? " · ★ " + p.rating : ""}<br><a class="plink" href="javascript:openSheet('${p.id}')">Details →</a>`);
    markers.push(m);
  }
}

// ----- list -----
function renderList() {
  const el = document.getElementById("listview");
  el.innerHTML = "";
  const items = filtered().slice().sort((a, b) => a.name.localeCompare(b.name));
  for (const p of items) {
    const st = store.status(p.id);
    const cats = effCats(p);
    const div = document.createElement("div");
    div.className = "item";
    const sub = [cats.map(c => CATS[c].emoji).join("") + " " + p.area, p.rating ? "★ " + p.rating : null, p.price || null, effNote(p) || null].filter(Boolean).join(" · ");
    div.innerHTML = `<span class="dot" style="background:${CATS[cats[0]].color}"></span>
      <span class="tx"><div class="nm">${esc(p.name)}</div><div class="sub">${esc(sub)}</div></span>`;
    const badge = document.createElement("button");
    badge.className = "badge " + st;
    badge.textContent = { want: "Want", beenplus: "👍", beenminus: "👎", fav: "❤️" }[st];
    badge.onclick = (e) => { e.stopPropagation(); cycleStatus(p.id); };
    div.appendChild(badge);
    div.onclick = () => openSheet(p.id);
    el.appendChild(div);
  }
  if (!items.length) el.innerHTML = '<p style="color:var(--muted);text-align:center;margin-top:40px">Nothing matches — clear some filters.</p>';
}
function cycleStatus(id) {
  const order = ["want", "beenplus", "beenminus", "fav"];
  const next = order[(order.indexOf(store.status(id)) + 1) % order.length];
  store.setStatus(id, next);
  render();
}

// ----- detail sheet -----
function openSheet(id) {
  const p = byId(id);
  if (!p) return;
  const st = store.status(id);
  const cats = effCats(p);
  const wrap = document.getElementById("sheetwrap");
  const sheet = document.getElementById("sheet");
  const gmaps = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  sheet.innerHTML = `
    <h2>${CATS[cats[0]].emoji} ${esc(p.name)}</h2>
    <div class="sub">${esc(p.area)}${p.rating ? " · ★ " + p.rating : ""}${p.price ? " · " + p.price : ""}<br>${esc(p.address || "")}</div>
    <div class="statusseg">
      ${Object.entries(STATUSES).map(([k, lab]) =>
        `<button class="${k === st ? "on " + k : ""}" data-s="${k}">${lab}</button>`).join("")}
    </div>
    <p class="lbl">Categories — tap to toggle</p>
    <div class="catgrid" id="catedit">
      ${Object.entries(CATS).map(([k, c]) =>
        `<button class="chip${cats.includes(k) ? " on" : ""}" data-c="${k}">${c.emoji} ${c.label}</button>`).join("")}
    </div>
    <p class="lbl">My note</p>
    <textarea id="noteedit" placeholder="Who recommended it, what to order, date-worthy?…">${esc(effNote(p))}</textarea>
    <div class="row">
      <a class="btn" style="text-decoration:none" href="${gmaps}" target="_blank">Open in Google Maps</a>
      <button class="btn ghost" id="closesheet">Close</button>
      <button class="btn danger" id="delplace">Delete place</button>
    </div>`;
  sheet.querySelectorAll(".statusseg button").forEach(b => {
    b.onclick = () => { store.setStatus(id, b.dataset.s); openSheet(id); render(); };
  });
  sheet.querySelectorAll("#catedit .chip").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.c;
      let next = cats.includes(k) ? cats.filter(x => x !== k) : [...cats, k];
      if (!next.length) next = ["other"];
      setCats(p, next);
      openSheet(id); render();
    };
  });
  sheet.querySelector("#noteedit").oninput = (e) => store.setNote(id, e.target.value);
  sheet.querySelector("#closesheet").onclick = closeSheet;
  sheet.querySelector("#delplace").onclick = () => {
    if (confirm(`Delete "${p.name}" from the app?`)) {
      if (p.id.startsWith("c")) store.data.custom = store.data.custom.filter(x => x.id !== p.id);
      else store.data.hidden.push(p.id);
      store.save(); closeSheet();
    }
  };
  wrap.classList.add("on");
  wrap.onclick = (e) => { if (e.target === wrap) closeSheet(); };
}
function closeSheet() { document.getElementById("sheetwrap").classList.remove("on"); render(); }

// ----- add place -----
document.getElementById("addbtn").onclick = openAddSheet;
function openAddSheet() {
  const wrap = document.getElementById("sheetwrap");
  const sheet = document.getElementById("sheet");
  let newCats = [];
  let coords = null;
  sheet.innerHTML = `
    <h2>＋ Add a place</h2>
    <p class="lbl">Paste a Google Maps link and everything fills in itself</p>
    <input type="text" id="np-link" placeholder="e.g. https://maps.app.goo.gl/…">
    <div class="row"><button class="btn ghost" id="np-import">✨ Import from link</button></div>
    <div class="hint" id="np-importmsg"></div>
    <p class="lbl">Name</p>
    <input type="text" id="np-name" placeholder="e.g. Juno the Bakery">
    <p class="lbl">Categories — tap all that apply</p>
    <div class="catgrid" id="np-cats">
      ${Object.entries(CATS).map(([k, c]) => `<button class="chip" data-c="${k}">${c.emoji} ${c.label}</button>`).join("")}
    </div>
    <p class="lbl">Location — search the address, or use where you are now</p>
    <input type="text" id="np-addr" placeholder="e.g. Århusgade 48, København">
    <div class="row">
      <button class="btn ghost" id="np-geocode">🔍 Find address</button>
      <button class="btn ghost" id="np-here">📍 I'm there now</button>
    </div>
    <div class="hint" id="np-loc">No location yet</div>
    <p class="lbl">Area / neighborhood (optional)</p>
    <input type="text" id="np-area" placeholder="e.g. Østerbro">
    <p class="lbl">Note (optional)</p>
    <textarea id="np-note" placeholder="Why is it on the list?"></textarea>
    <div class="row">
      <button class="btn" id="np-save">Save place</button>
      <button class="btn ghost" id="closesheet">Cancel</button>
    </div>`;
  const locEl = sheet.querySelector("#np-loc");
  sheet.querySelectorAll("#np-cats .chip").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.c;
      newCats = newCats.includes(k) ? newCats.filter(x => x !== k) : [...newCats, k];
      b.classList.toggle("on");
    };
  });
  sheet.querySelector("#np-import").onclick = async () => {
    const msgEl = sheet.querySelector("#np-importmsg");
    const raw = sheet.querySelector("#np-link").value.trim();
    const url = (raw.match(/https?:\/\/\S+/) || [])[0];
    if (!url) { msgEl.textContent = "Paste a Google Maps link first"; return; }
    // Google blocks cross-site reads, so resolve the link through a CORS relay.
    // Free relays are flaky, so try several, twice, with a timeout each.
    const relays = [
      u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
      u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
      u => "https://api.codetabs.com/v1/proxy?quest=" + u,
    ];
    let html = null;
    for (const mk of [...relays, ...relays]) {
      msgEl.textContent = "Importing…";
      try {
        const r = await fetch(mk(url), { signal: AbortSignal.timeout(10000) });
        const t = await r.text();
        if (r.ok && t.includes("/maps/place/")) { html = t; break; }
      } catch { /* next relay */ }
    }
    if (!html) { msgEl.textContent = "Couldn't reach Google Maps right now — try again, or use Find address below"; return; }
    let name = null, coords2 = null;
    const mPlace = html.match(/\/maps\/place\/([^\/@"'\\]+)/);
    if (mPlace) { try { name = decodeURIComponent(mPlace[1].replace(/\+/g, " ")); } catch { name = mPlace[1]; } }
    const mPin = html.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
    const mAt = html.match(/\/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    if (mPin) coords2 = { lat: +mPin[1], lng: +mPin[2] };
    else if (mAt) coords2 = { lat: +mAt[1], lng: +mAt[2] };
    if (!name && !coords2) { msgEl.textContent = "Couldn't read that link — use Find address below"; return; }
    if (name) sheet.querySelector("#np-name").value = name;
    if (coords2) { coords = coords2; locEl.textContent = "✓ Location set from link"; }
    msgEl.textContent = `✓ Imported${name ? ": " + name : ""} — pick categories and save`;
    if (coords2) {
      // Backfill address + neighborhood from the coordinates.
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${coords2.lat}&lon=${coords2.lng}`, { signal: AbortSignal.timeout(10000) });
        const js = await r.json();
        const a = js.address || {};
        const street = [a.road, a.house_number].filter(Boolean).join(" ");
        const cityline = [a.postcode, a.city || a.town || a.village].filter(Boolean).join(" ");
        const addr = [street, cityline].filter(Boolean).join(", ");
        if (addr && !sheet.querySelector("#np-addr").value) sheet.querySelector("#np-addr").value = addr;
        const hood = a.suburb || a.neighbourhood || a.quarter || a.city_district || a.city || "";
        if (hood && !sheet.querySelector("#np-area").value) sheet.querySelector("#np-area").value = hood;
      } catch { /* address stays manual */ }
    }
  };
  sheet.querySelector("#np-geocode").onclick = async () => {
    const q = sheet.querySelector("#np-addr").value.trim() || sheet.querySelector("#np-name").value.trim();
    if (!q) { locEl.textContent = "Type an address or name first"; return; }
    locEl.textContent = "Searching…";
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=dk,se,de&q=${encodeURIComponent(q)}`);
      const js = await r.json();
      if (js.length) {
        coords = { lat: +js[0].lat, lng: +js[0].lon };
        locEl.textContent = `✓ Found: ${js[0].display_name.slice(0, 70)}…`;
      } else locEl.textContent = "No match — try adding the street or city";
    } catch { locEl.textContent = "Search failed — check connection"; }
  };
  sheet.querySelector("#np-here").onclick = () => {
    locEl.textContent = "Getting your location…";
    navigator.geolocation.getCurrentPosition(
      pos => { coords = { lat: pos.coords.latitude, lng: pos.coords.longitude }; locEl.textContent = `✓ Using your current location`; },
      () => { locEl.textContent = "Couldn't get location — allow access in Settings"; },
      { enableHighAccuracy: true, timeout: 8000 });
  };
  sheet.querySelector("#np-save").onclick = () => {
    const name = sheet.querySelector("#np-name").value.trim();
    if (!name) { alert("Give it a name"); return; }
    if (!coords) { alert("Set a location first (Find address or I'm there now)"); return; }
    store.data.custom.push({
      id: "c" + Date.now(),
      name,
      cats: newCats.length ? newCats : ["other"],
      area: sheet.querySelector("#np-area").value.trim() || "Copenhagen",
      address: sheet.querySelector("#np-addr").value.trim(),
      lat: coords.lat, lng: coords.lng,
      note: sheet.querySelector("#np-note").value.trim(),
    });
    store.save(); closeSheet();
  };
  sheet.querySelector("#closesheet").onclick = closeSheet;
  wrap.classList.add("on");
  wrap.onclick = (e) => { if (e.target === wrap) closeSheet(); };
}

// ----- tonight -----
const MOODS = {
  drinks:  { label: "🍷 Drinks",         cats: ["wine", "bar", "jazz"] },
  music:   { label: "🎶 Live music",     cats: ["jazz", "club"] },
  dinner:  { label: "🍝 Dinner",         cats: ["restaurant", "street"] },
  coffee:  { label: "☕ Coffee & cake",  cats: ["cafe", "bakery"] },
  culture: { label: "🖼️ Culture",        cats: ["museum", "sight", "stage", "shop"] },
  away:    { label: "🌊 Out of town",    cats: ["trip"] },
};
// Time-aware default: mornings suggest coffee, afternoons culture, evenings dinner, nights drinks.
function defaultMood() {
  const h = new Date().getHours();
  if (h < 11) return "coffee";
  if (h < 16) return "culture";
  if (h < 20) return "dinner";
  return "drinks";
}
let mood = defaultMood();
function buildMoodChips() {
  const el = document.getElementById("moodchips");
  el.innerHTML = "";
  for (const [k, m] of Object.entries(MOODS)) {
    el.appendChild(mkChip(m.label, () => { mood = mood === k ? null : k; buildMoodChips(); }, mood === k));
  }
}
buildMoodChips();
document.getElementById("roll").onclick = () => {
  // Mood spans several categories and skips places already visited; favorites count double.
  const inMood = p => mood ? effCats(p).some(c => MOODS[mood].cats.includes(c)) : !effCats(p).includes("other");
  const visited = id => ["beenplus", "beenminus"].includes(store.status(id));
  let pool = allPlaces().filter(p => inMood(p) && !visited(p.id));
  if (!pool.length) pool = allPlaces().filter(inMood);
  if (!pool.length) return;
  const weighted = pool.flatMap(p => store.status(p.id) === "fav" ? [p, p] : [p]);
  const p = weighted[Math.floor(Math.random() * weighted.length)];
  const c = document.getElementById("tcard");
  c.innerHTML = `<div class="cat">${CATS[effCats(p)[0]].emoji}</div><h2>${esc(p.name)}</h2>
    <div class="sub">${effCats(p).map(x => CATS[x].label).join(" · ")} · ${esc(p.area)}${p.rating ? " · ★ " + p.rating : ""}${p.price ? " · " + p.price : ""}<br>${esc(effNote(p))}</div>
    <button class="btn" onclick="openSheet('${p.id}')">Details</button>`;
};

// ----- export / import -----
document.getElementById("exportbtn").onclick = () => {
  const blob = new Blob([JSON.stringify(store.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cph-places-backup.json";
  a.click();
};
document.getElementById("importfile").onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(t => {
    try {
      store.data = JSON.parse(t);
      store.data.statuses ||= {}; store.data.notes ||= {}; store.data.cats ||= {}; store.data.custom ||= []; store.data.hidden ||= [];
      store.save(); render(); alert("Imported ✓");
    }
    catch { alert("Not a valid backup file"); }
  });
};

// ----- nav / search -----
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".view").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById(b.dataset.v).classList.add("on");
    if (b.dataset.v === "mapview") setTimeout(() => map.invalidateSize(), 60);
  };
});
document.getElementById("search").oninput = (e) => { query = e.target.value.trim(); render(); };

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function render() {
  buildChips();
  renderMap();
  renderList();
  const n = filtered().length;
  const sv = Object.values(store.data.statuses);
  document.getElementById("counts").textContent =
    `${n} of ${allPlaces().length} places · ${sv.filter(s => s === "beenplus").length} 👍 · ${sv.filter(s => s === "beenminus").length} 👎 · ${sv.filter(s => s === "fav").length} ❤️`;
  const rb = document.getElementById("restorebtn");
  const nh = store.data.hidden.length;
  rb.style.display = nh ? "" : "none";
  rb.textContent = `Restore ${nh} deleted place${nh === 1 ? "" : "s"}`;
  rb.onclick = () => {
    if (confirm(`Bring back ${nh} deleted place${nh === 1 ? "" : "s"}?`)) {
      store.data.hidden = []; store.save(); render();
    }
  };
}
render();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js");
}

// iOS keeps home-screen apps suspended, so a reopen isn't a reload. Refresh
// when returning to the foreground after 10+ minutes to pick up new deploys.
let hiddenAt = null;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) location.reload();
});
</script>
